name: mac-arm64
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  JUMP_KEY: ${{ vars.JUMP_KEY }}
jobs:
  t:
    runs-on: macos-latest
    steps:
      - name: Run
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 写入密钥
          echo "${{ vars.JUMP_KEY }}" > ~/.ssh/jump_key
          chmod 600 ~/.ssh/jump_key
          
          # 打印出来看格式
          echo "=== KEY CONTENT START ==="
          cat ~/.ssh/jump_key
          echo "=== KEY CONTENT END ==="
          
          # 检查文件权限
          ls -l ~/.ssh/jump_key
          
          # 后续 ssh 命令
          ssh -p 29932 -i ~/.ssh/jump_key \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3 \
              -R 3022:localhost:22 \
              root@kvs5.kkocdko.site \
              "sleep infinity" &
          
          sleep 5
          echo "Tunnel established"
          while true; do sleep 60; done
