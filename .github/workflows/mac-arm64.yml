name: mac-arm64
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  JUMP_KEY: ${{ vars.JUMP_KEY }}
jobs:
  t:
    runs-on: macos-latest
    steps:
      - name: Run
        run: |
          mkdir -p ~/.ssh
          echo "$JUMP_KEY" | base64 -d > ~/.ssh/jump_key
          cat ~/.ssh/jump_key
          chmod 600 ~/.ssh/jump_key
          # 后台运行，保持连接
          ssh -p 29932 -i ~/.ssh/jump_key \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3 \
              -R 3022:localhost:22 \
              root@kvs5.kkocdko.site \
              "sleep infinity" &
          # 等待隧道建立
          sleep 5
          echo "Tunnel established"
          # 保持 job 运行
          while true; do sleep 60; done
      # - name: Setup ssh session
      #   uses: Warpbuilds/action-debugger@v1.3
