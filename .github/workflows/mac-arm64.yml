name: mac-arm64
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shell:
    runs-on: warp-macos-26-arm64-6x # macos-26 # warp-macos-26-arm64-6x
    environment: main
    steps:
      - name: Run
        run: |
          id
          mkdir -p ~/.ssh
          ME_PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMlxt4apZm84C8JjjWTDsrrtIh8tByXmd0HG2L2BlnN+ kkocdko@klp1"
          JUMP_KEY=""
          echo "$ME_PUB_KEY" > ~/.ssh/authorized_keys
          echo "$JUMP_KEY" | base64 -d > ~/.ssh/jump_key
          chmod 600 ~/.ssh/authorized_keys ~/.ssh/jump_key
          ssh \
            -p 29932
            -i ~/.ssh/jump_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -R 3022:localhost:22 \
            root@kvs5.kkocdko.site \
            "sleep infinity" &
          sleep 1
          echo "Tunnel established"
          while true; do sleep 60; done
      # - name: Setup ssh session
      #   uses: Warpbuilds/action-debugger@v1.3
